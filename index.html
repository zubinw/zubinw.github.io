<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        #copy-section select,
        #copy-section textarea {
            display: block;
            width: 90%;
            max-width: 1200px;
            padding: 8px;
            font-size: 1rem;
            margin-bottom: 8px;
        }
        #copy-section textarea {
            height: 80px;
            font-size: 0.75rem;
        }
        #copy-section button {
            padding: 8px 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    body {
    background-color: #1e1e2e;
    color: white; /* use light text on a dark background */
}
    <h1>Hello, World!</h1>
    <p>Welcome to my GitHub Pages website.</p>

    <section id="copy-section">
        <h2>Netherite Shulker Commands</h2>
        <p>Cheats must be on. Long commands work best in a command block.</p>

        <!-- CHANGE #1: the dropdown names people see -->
        <select id="textPicker">
            <option value="normal">Normal enchants</option>
            <option value="max">Level 255 enchants</option>
            <option value="stick">One Hit Stick</option>
        </select>

        <textarea id="copyText" readonly></textarea>
        <button id="copyBtn">Copy command</button>
    </section>

    <script>
        // [item id, [[enchant, normal level], ...]]
        var ITEMS = [
         ["netherite_helmet",[["protection",4],["unbreaking",3],["mending",1],["respiration",3],["aqua_affinity",1],["thorns",3]]],
         ["netherite_chestplate",[["protection",4],["unbreaking",3],["mending",1],["thorns",3]]],
         ["netherite_leggings",[["protection",4],["unbreaking",3],["mending",1],["thorns",3],["swift_sneak",3]]],
         ["netherite_boots",[["protection",4],["unbreaking",3],["mending",1],["feather_falling",4],["depth_strider",3],["soul_speed",3],["thorns",3]]],
         ["netherite_sword",[["sharpness",5],["unbreaking",3],["mending",1],["looting",3],["fire_aspect",2],["sweeping_edge",3]]],
         ["netherite_pickaxe",[["efficiency",5],["unbreaking",3],["mending",1],["fortune",3]]],
         ["netherite_pickaxe",[["efficiency",5],["unbreaking",3],["mending",1],["silk_touch",1]]],
         ["netherite_axe",[["efficiency",5],["unbreaking",3],["mending",1],["sharpness",5]]],
         ["netherite_shovel",[["efficiency",5],["unbreaking",3],["mending",1],["fortune",3]]],
         ["netherite_hoe",[["efficiency",5],["unbreaking",3],["mending",1],["fortune",3]]],
         ["mace",[["density",5],["wind_burst",3],["fire_aspect",2],["unbreaking",3],["mending",1]]],
         ["trident",[["impaling",5],["loyalty",3],["channeling",1],["unbreaking",3],["mending",1]]],
         ["netherite_spear",[["sharpness",5],["fire_aspect",2],["looting",3],["lunge",3],["unbreaking",3],["mending",1]]],
         ["trident",[["impaling",5],["riptide",3],["unbreaking",3],["mending",1]]],
         ["mace",[["breach",4],["smite",5],["bane_of_arthropods",5],["fire_aspect",2],["unbreaking",3],["mending",1]]]
        ];

        function build(max, name) {
            var slots = ITEMS.map(function (it, i) {
                var ench = it[1].map(function (e) {
                    return '"minecraft:' + e[0] + '":' + (max ? 255 : e[1]);
                }).join(",");
                return '{slot:' + i + ',item:{id:"minecraft:' + it[0] + '",components:{enchantments:{' + ench + '}}}}';
            });
            return '/give @s shulker_box[custom_name={text:"' + name + '",italic:false},container=[' + slots.join(",") + ']]';
        }

        var STICK = '{id:"minecraft:stick",components:{max_damage:1,damage:0,max_stack_size:1,weapon:{item_damage_per_attack:1},custom_name:{text:"One Hit Stick",italic:false},attribute_modifiers:[{type:"minecraft:attack_damage",id:"minecraft:base_attack_damage",amount:2048,operation:"add_value",slot:"mainhand"}]}}';
        var stickSlots = [];
        for (var s = 0; s < 27; s++) { stickSlots.push('{slot:' + s + ',item:' + STICK + '}'); }

        // CHANGE #2: the command that goes with each option.
        // The names on the left must match the value="" in the dropdown above.
        const texts = {
            normal: build(false, "Normal Enchants Shulker"),
            max: build(true, "OP Enchants Shulker"),
            stick: '/give @s shulker_box[custom_name={text:"One Hit Stick",italic:false},container=[' + stickSlots.join(",") + ']]'
        };

        const picker = document.getElementById("textPicker");
        const box = document.getElementById("copyText");
        const btn = document.getElementById("copyBtn");

        box.value = texts[picker.value];
        picker.addEventListener("change", () => {
            box.value = texts[picker.value];
        });

        btn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(box.value);
                btn.textContent = "Copied!";
                setTimeout(() => { btn.textContent = "Copy command"; }, 2000);
            } catch (err) {
                box.select(); // fallback: highlights text so they can press Ctrl+C
            }
        });
    </script>
</body>
</html>
